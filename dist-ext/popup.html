<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        background: #171c23;
        color: #e8ecf1;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: #0f1216;
        border-bottom: 1px solid #2a3341;
      }
      header .logo { font-size: 16px; }
      header h1 { font-size: 13px; margin: 0; font-weight: 650; }
      header h1 span { color: #4f8cff; }
      main { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      .page-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .page-url { color: #9aa7b5; font-family: Consolas, monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      button {
        border: 0;
        border-radius: 9px;
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: #2f6bff;
        color: #fff;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      button.secondary { background: #1f2630; color: #e8ecf1; border: 1px solid #2a3341; font-weight: 500; }
      .cats { display: flex; flex-wrap: wrap; gap: 5px; }
      .chip { border: 1px solid #2a3341; background: #1f2630; color: #9aa7b5; border-radius: 20px; padding: 2px 9px; font-size: 11px; }
      .msg { padding: 8px 10px; border-radius: 8px; font-size: 12.5px; }
      .msg.ok { background: rgba(47, 107, 255, 0.15); border: 1px solid rgba(79, 140, 255, 0.4); }
      .msg.warn { background: rgba(255, 180, 0, 0.12); border: 1px solid rgba(255, 180, 0, 0.35); }
      .recent { border-top: 1px solid #2a3341; padding-top: 10px; }
      .recent h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: #9aa7b5; margin: 0 0 6px; }
      .recent a { display: block; color: #e8ecf1; text-decoration: none; padding: 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .recent a:hover { color: #4f8cff; }
      footer { padding: 0 12px 12px; }
      footer a { color: #4f8cff; text-decoration: none; font-size: 12.5px; }
    </style>
    <script type="module" crossorigin src="./assets/popup.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  </head>
  <body>
    <header>
      <span class="logo">🔖</span>
      <h1>Bookmarks <span>Dynamic Manager</span></h1>
    </header>
    <main>
      <div>
        <div class="page-title" id="pageTitle">Lese aktuelle Seite …</div>
        <div class="page-url" id="pageUrl"></div>
      </div>
      <button id="save">★ Diese Seite speichern</button>
      <div id="result"></div>
      <div id="cats" class="cats"></div>
      <div class="recent" id="recent" hidden>
        <h3>Zuletzt hinzugefügt</h3>
        <div id="recentList"></div>
      </div>
    </main>
    <footer><a href="#" id="openManager">🗂️ Manager öffnen …</a></footer>
  </body>
</html>
