name: Echtes Chromium-Add-on prüfen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  addon:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run build:ext
      - name: Isolierte Browser-Testumgebung
        run: |
          mkdir -p "$RUNNER_TEMP/bdm-browser-runtime"
          bun add --cwd "$RUNNER_TEMP/bdm-browser-runtime" --exact playwright@1.64.1
          node "$RUNNER_TEMP/bdm-browser-runtime/node_modules/playwright/cli.js" install --with-deps chromium
          python -m zipfile -e releases/v1.4.0/bookmarks-dynamic-manager-chrome.zip .data/browser-addon
      - run: node scripts/verify-addon.mjs
        env:
          PLAYWRIGHT_MODULE: file://${{ runner.temp }}/bdm-browser-runtime/node_modules/playwright/index.mjs
